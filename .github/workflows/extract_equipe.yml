name: Extraction pieces jointes - Equipe

on:
  workflow_dispatch:
    inputs:
      senders:
        description: "Adresse(s) email a interroger (separees par des espaces). Vide = liste par defaut (7 boites)."
        required: false
        default: ""
  schedule:
    # Chaque jour a 03:00 UTC (06:00 heure de Madagascar). Le declenchement
    # programme n'a pas acces aux "inputs" du formulaire manuel -> fallback
    # sur la liste par defaut du script (voir logique SENDERS_ARGS ci-dessous).
    - cron: "0 3 * * *"

jobs:
  # Construit la liste des boites a traiter (celle fournie, ou la liste par
  # defaut du script) et l'expose au format JSON attendu par une matrice
  # GitHub Actions.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      senders_json: ${{ steps.build.outputs.senders_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construire la liste des boites (JSON pour la matrice)
        id: build
        run: |
          if [ -n "${{ inputs.senders }}" ]; then
            SENDERS="${{ inputs.senders }}"
          else
            # Doit rester synchronise avec DEFAULT_SENDERS dans extract_equipe.py
            SENDERS="angelo.nahavitatsara@madavance.org domoina@madavance.org nary.ramanarivo@madavance.org amede.rafidimanantsoa@madavance.org lucienne.rasamoelina@madavance.org fideline.fanomezantsoa@madavance.org Frantzel.andrianalison@madavance.org alidah@madavance.org fanja@madavance.org fara@madavance.org comptable@madavance.org mickael.consultant@madavance.org admin@madavance.org olivia@madavance.org rakitrynyavo@madavance.org holisoa.raharijaona@madavance.org eddy.rajaonarivony@madavance.org karelle@madavance.org"
          fi
          JSON=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split()))" "$SENDERS")
          echo "senders_json=$JSON" >> "$GITHUB_OUTPUT"

  # Un job independant par boite, tous lancent en parallele : chaque boite
  # dispose de ses propres 6h (limite dure GitHub Actions par job), au lieu
  # de partager un seul budget de 6h pour les 6 boites a la suite.
  extract-equipe:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sender: ${{ fromJson(needs.prepare.outputs.senders_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract all attachments (no filter) - ${{ matrix.sender }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_FOLDER_LINK_EQUIPE: ${{ secrets.SHAREPOINT_FOLDER_LINK_EQUIPE }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          python extract_equipe.py --senders "${{ matrix.sender }}"

      - name: Upload as artifact (copie temporaire de secours)
        uses: actions/upload-artifact@v4
        with:
          name: pieces-jointes-equipe-${{ matrix.sender }}
          path: ./pieces_jointes_equipe
          retention-days: 7

